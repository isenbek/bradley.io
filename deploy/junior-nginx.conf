# TEMPORARY — nginx glue for the unlisted, PIN-gated /junior page.
#
# Installed as /etc/nginx/snippets/junior.conf and pulled into the bradley.io
# :443 server block with `include snippets/junior.conf;`.
#
# The security model in one line: ttyd (127.0.0.1:7682) has NO authentication
# of its own, so every request to /junior/pty must first survive an
# `auth_request` subrequest against the Next.js app, which validates the
# HMAC-signed PIN cookie. If that subrequest is ever removed, the shell is open
# to the internet.
#
# Teardown: see docs/junior-teardown.md

# Internal only — asks the app "is this cookie valid?". 204 = yes, 401 = no.
location = /junior/_authcheck {
    internal;
    proxy_pass              http://127.0.0.1:32221/api/junior/check;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Host $host;
    proxy_set_header        X-Original-URI $request_uri;
}

# The PTY bridge (ttyd serves its own index, token endpoint and websocket
# under this base path).
location /junior/pty {
    auth_request /junior/_authcheck;

    proxy_pass         http://127.0.0.1:7682;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # A terminal session sits idle for long stretches; don't cut it at 60s.
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering    off;
}
