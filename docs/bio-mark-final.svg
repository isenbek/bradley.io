                                                          medial-axis crossing agrees to ~5px]
    spine axis x .................... ~142  (bbox-mid 141.3 · dot 141.9 · i-crest 142.6 · ∞-centre 142.5)
    i-tittle plumb .................. dot is 0.70px off the crest, ~12.7px gap
    ∞ axis .......................... seg3-ctr (-110.8,3.2) → heart → seg16-ctr (242.1,232.0)
    service road (construction only)  centre-of-16 (242.1,232.0) → heart → end-of-3 (-86.6,12.0)
                                      12.8° dogleg at the heart; not rendered, by design.
-->
